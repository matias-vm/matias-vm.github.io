<!DOCTYPE html>
<html lang="en">
<head>

  <title>FRITO</title>
  <link rel="icon" type="image/x-icon" href="../images/favicon_frito.png">

  <style>

      font-family: Courier;
      margin: 2rem;
      background-color: #FAE7B5;
    }

    }

    figure {
      display: inline-block;
      margin: 1rem;
      text-align: center;
      vertical-align: top;

    figure img {
      width: 100%;
      max-width: 300px;
      height: auto;
      display: block;
      margin-bottom: 0.5rem;
    }

    figcaption {
      font-size: 0.9rem;
      color: #555;
    }

    video {
      width: 100%;
      max-width: 500px;
      height: auto;
      display: block;
      margin-bottom: 0.5rem;
    }

    footer {

    }

</head>


<body>

<h1>FRITO</h1>
